apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: db

spec:
  serviceName: db-service
  replicas: 3

  selector:
    matchLabels:
      app: db

  template:
    metadata:
      labels:
        app: db
    spec:
      containers:
      - name: postgres
        image: postgres:15

        ports:
        - containerPort: 5432

        env:
        - name: POSTGRES_USER
          value: admin

        - name: POSTGRES_PASSWORD
          value: admin123

        - name: POSTGRES_DB
          value: mydb

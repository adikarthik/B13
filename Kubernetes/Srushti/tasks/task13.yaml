apiVersion: apps/v1

kind: Deployment

metadata:

  name: batch-deploy

spec:

  replicas: 2

  selector:

    matchLabels:

      app: batch

  template:

    metadata:

      labels:

        app: batch

    spec:

      containers:

      - name: batch

        image: tomcat:8.0

        resources:
          requests:
            cpu: "250m"

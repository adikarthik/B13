apiVersion: v1

kind: Pod

metadata:

  name: api-pod

  labels:

    app: api

spec:

  containers:

  - name: api

    image: registry.k8s.io/e2e-test-images/agnhost:2.45

    ports:

    - containerPort: 8080

    readinessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10

    livenessProbe:
      httpGet:
        path: /healthz
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10

trigger: none

pool:
  name: B13-pool

variables:
  azureServiceConnection: 'sanjuapp'
  backendResourceGroup: 'rg-sanju'
  backendStorageAccount: 'sanju01'
  backendContainer: 'sacont'
  backendKey: 'B13.tfstate'

stages:

- stage: sonarstage
  displayName: SonarQube Cloud Scan

  jobs:
  - job: SonarCloudScanJob
    displayName: Run SonarQube Cloud Scan
    steps:

    - checkout: self


    - task: SonarCloudPrepare@3
      displayName: Prepare SonarQube Cloud Analysis
      inputs:
        SonarCloud: 'sonar'
        organization: 'sanjugm45'
        scannerMode: 'cli'
        configMode: 'manual'
        cliProjectKey: 'sanjugm45_Devops'
        cliProjectName: 'Devops'
        cliSources: '.'

    - task: SonarCloudAnalyze@3
      displayName: Run SonarQube Cloud Analysis

    - task: SonarCloudPublish@3
      displayName: Publish SonarQube Cloud Results
      inputs:
        pollingTimeoutSec: '300'


- stage: Init
  displayName: Terraform Init

  jobs:
  - job: InitJob
    displayName: Terraform Init

    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: Terraform Init
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: ps
        scriptLocation: inlineScript
        workingDirectory: '$(Build.SourcesDirectory)\terraform'
        inlineScript: |
          terraform version

          terraform init `
            -backend-config="resource_group_name=$(backendResourceGroup)" `
            -backend-config="storage_account_name=$(backendStorageAccount)" `
            -backend-config="container_name=$(backendContainer)" `
            -backend-config="key=$(backendKey)"

    - task: PublishPipelineArtifact@1
      displayName: Publish Terraform Files
      inputs:
        targetPath: '$(Build.SourcesDirectory)\terraform'
        artifact: terraform-files

- stage: Plan
  displayName: Terraform Plan
  dependsOn: Init

  jobs:
  - job: PlanJob
    displayName: Terraform Plan

    steps:
    - checkout: self

    - task: DownloadPipelineArtifact@2
      displayName: Download Terraform Files
      inputs:
        artifact: terraform-files
        path: '$(Pipeline.Workspace)\terraform'

    - task: PowerShell@2
      displayName: Copy Terraform Files
      inputs:
        targetType: inline
        script: |
          Copy-Item `
            -Path "$(Pipeline.Workspace)\terraform\*" `
            -Destination "$(Build.SourcesDirectory)\terraform" `
            -Recurse -Force



    - task: AzureCLI@2
      displayName: Terraform Plan
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: ps
        scriptLocation: inlineScript
        workingDirectory: '$(Build.SourcesDirectory)\terraform'
        inlineScript: |
          terraform plan



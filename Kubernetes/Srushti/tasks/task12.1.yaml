apiVersion: autoscaling/v2

kind: HorizontalPodAutoscaler

metadata:

  name: api-hpa

spec:

  scaleTargetRef:

    apiVersion: apps/v1

    kind: Deployment

    name: api-deploy

  minReplicas: 2

  maxReplicas: 10

  metrics:

  - type: Resource

    resources:
     requests:
       cpu: "100m"
       memory: "128Mi"
     limits:
       cpu: "500m"
       memory: "512Mi"

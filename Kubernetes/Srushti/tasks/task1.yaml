apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deploy

spec:
  replicas: 2

  selector:
    matchLabels:
      app: api-v2

  template:
    metadata:
      labels:
        app: api-v2

    spec:
      containers:
      - name: api
        image: tomcat:10.1-jdk17
        ports:
        - containerPort: 8080

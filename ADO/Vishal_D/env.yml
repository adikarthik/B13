trigger: none

pool:
  name: Batch13-agents

variables:
  storageaccountname: vdsa133
  storagecontainername: vdc

stages:
- stage: CopyStage
  displayName: Copy Files to Azure Blob

  jobs:
  - deployment: AzureBlobCopyDeployment
    displayName: Copy File to Azure Blob

    environment: dev-approver

    strategy:
      runOnce:
        deploy:
          steps:

          - checkout: self

          - task: AzureFileCopy@6
            displayName: StorageAccountFileTransfer
            inputs:
              SourcePath: 'class2.txt'
              azureSubscription: 'VDSP'
              Destination: AzureBlob
              storage: '$(storageaccountname)'
              ContainerName: '$(storagecontainername)'